<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AI에게 일을 맡기기 전에, 먼저 가져야 할 기준을 살펴보는 공개 웹 콘텐츠입니다.">
  <meta name="theme-color" content="#0d1420">
  <title>AI를 대하는 태도 · Direction B</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="css/style-direction-b.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>
  <div class="ambient ambient--one" aria-hidden="true"></div>
  <div class="ambient ambient--two" aria-hidden="true"></div>

  <section id="scene-start" class="scene is-active" aria-labelledby="start-title">
    <div class="start-inner">
      <p class="start-kicker"></p>
      <h1 id="start-title" class="start-title"></h1>
      <p class="start-sub"></p>
      <button id="enter-btn" class="enter-btn" type="button">
        <span class="enter-btn__label">시작하기</span>
        <span class="enter-btn__glow" aria-hidden="true"></span>
      </button>
      <p class="start-note"></p>
    </div>
  </section>

  <div id="warp" class="warp" aria-hidden="true"></div>

  <section id="scene-slides" class="scene" aria-labelledby="slide-lecture-name">
    <header class="slide-topbar">
      <button id="slide-exit" class="slide-exit" type="button">← 처음으로</button>
      <span id="slide-lecture-name" class="slide-lecture-name"></span>
      <span id="slide-counter" class="slide-counter">1 / 1</span>
    </header>
    <div class="slide-progress"><span id="slide-progress-fill"></span></div>
    <div id="slide-stage" class="slide-stage"></div>
    <div class="slide-nav">
      <button id="slide-prev" class="slide-btn" type="button">◀ 이전</button>
      <div id="slide-dots" class="slide-dots"></div>
      <button id="slide-next" class="slide-btn" type="button">다음 ▶</button>
    </div>
  </section>

  <div id="rotate-hint" class="rotate-hint" hidden>
    <span class="rotate-hint__icon">↻</span>
    <span class="rotate-hint__text">기기를 <b>가로</b>로 돌리면 더 넓게 볼 수 있어요</span>
    <button id="rotate-hint-close" class="rotate-hint__close" type="button" aria-label="닫기">✕</button>
  </div>

  <script src="js/deck-api.js"></script>
  <script src="js/data.js"></script>
  <script src="js/slides.js"></script>
  <script src="js/intro.js"></script>
  <script src="js/deck-main.js"></script>
</body>
</html>
